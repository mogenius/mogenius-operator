name: Build, Package, Release (Develop)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the image (default: computed from latest release tag)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_PREFIX: ghcr.io/mogenius
  HELMNAME: "mogenius-operator-dev"

jobs:

  # ============================================================================
  # Prepare - Compute dev version (no release commits, no tags)
  # ============================================================================
  prepare:
    runs-on: [self-hosted]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${VERSION_OVERRIDE}" ]; then
            VERSION="${VERSION_OVERRIDE}"
          else
            # Next minor after the latest stable release tag, suffixed with a
            # monotonically increasing dev counter. Nothing is committed back.
            LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            BASE="${LATEST_TAG#v}"
            if [ -z "${BASE}" ]; then
              BASE="0.0.0"
            fi
            IFS=. read -r MAJOR MINOR _ <<< "${BASE}"
            VERSION="${MAJOR}.$((MINOR + 1)).0-develop.${GITHUB_RUN_NUMBER}"
          fi

          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "## Version Info" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${VERSION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${GITHUB_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${GITHUB_REF_NAME} |" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Build Operator - Native builds per architecture
  # ============================================================================
  build-operator:
    needs: [prepare]
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@157683e012c4ba4e22e86fe4e00ddf295215c483 # v1.9.2
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      image: ghcr.io/mogenius/mogenius-operator-dev
      architectures: amd64,arm64
      push_latest: false
      sign_image: true
      build_args: |
        DEV_BUILD=yes
      build_args_amd64: |
        GO_BUILDER_IMAGE=ghcr.io/mogenius/go-builder:latest-amd64
        BPFTOOL_IMAGE=ghcr.io/mogenius/bpftool:latest-amd64
      build_args_arm64: |
        GO_BUILDER_IMAGE=ghcr.io/mogenius/go-builder:latest-arm64
        BPFTOOL_IMAGE=ghcr.io/mogenius/bpftool:latest-arm64

  # ============================================================================
  # Publish Helm chart to GitHub Pages
  # ============================================================================
  helm-publish:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build-operator]
    uses: mogenius/github-actions/.github/workflows/helm-publish.yml@157683e012c4ba4e22e86fe4e00ddf295215c483 # v1.9.2
    secrets:
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_SECRET }}
    with:
      chart-path: helm/charts/mogenius-operator
      version: ${{ needs.prepare.outputs.version }}
      app-version: ${{ needs.prepare.outputs.version }}
      channel: public
      pre-package: |
        sed -i -e "s/repository: mogenius\/mogenius-operator/repository: mogenius\/mogenius-operator-dev/" values.yaml
        sed -i -e "s/name: mogenius-operator/name: mogenius-operator-dev/" Chart.yaml

  # ============================================================================
  # Push Helm chart to OCI registry + sign
  # ============================================================================
  helm-oci:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build-operator]
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Import GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --import --batch

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Update chart for dev
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd ./helm/charts/mogenius-operator
          sed -i -e "s/repository: mogenius\/mogenius-operator/repository: mogenius\/mogenius-operator-dev/" values.yaml
          sed -i -e "s/name: mogenius-operator/name: mogenius-operator-dev/" Chart.yaml
          sed -i -E "s/appVersion: \".*\"/appVersion: \"${VERSION}\"/" Chart.yaml
          sed -i -E "s/^version: .*/version: ${VERSION}/" Chart.yaml

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2
        with:
          chart-search-root: helm

      - name: Package, sign, and push to OCI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -x

          cd ./helm/charts/mogenius-operator

          gpg --export-secret-keys > ~/.gnupg/secring.gpg

          helm package . -d /tmp/ --version ${VERSION} --app-version ${VERSION} \
            --sign \
            --key "Helm Charts" \
            --keyring ~/.gnupg/secring.gpg

          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          CHART_DIGEST=$(helm push /tmp/${{ env.HELMNAME }}-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/helm-charts 2>&1 | grep "Digest: sha256:" | awk '{print $2}')
          if [ -z "$CHART_DIGEST" ]; then
            echo "Failed to extract chart digest"
            exit 1
          fi
          echo "Chart digest: $CHART_DIGEST"

          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io --username ${{ github.actor }} --password-stdin
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/helm-charts/${{ env.HELMNAME }}@${CHART_DIGEST}
