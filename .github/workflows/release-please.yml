# Cuts the release PR from the commit messages on main.
#
# Two things to know before writing one:
#
#   - A `!` after the type, or a `BREAKING CHANGE:` footer, makes the next
#     release a major. Use it only when a released surface changes
#     incompatibly -- removing something that was never in a tag is not a
#     breaking change, and a stray `!` has already cost this repository a
#     wrong 3.0.0 proposal.
#   - A wrong version can be overridden with a `Release-As: x.y.z` footer on a
#     commit that lands on main. It has to carry a diff: an empty commit is
#     dropped by a squash merge, footer and all.
name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    uses: mogenius/github-actions/.github/workflows/release-please.yml@b198c21dc984080a27bbda6f6d88f2c852c79020 # v1.13.3
    with:
      config_file: release-please-config.json
      manifest_file: .release-please-manifest.json
    secrets:
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_SECRET }}
