name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  test:
    uses: mogenius/github-actions/.github/workflows/go-test.yml@75995e916be275ed15c2dd4748d664f5e35dfb89 # v1.7.2
    with:
      path: src
  lint:
    uses: mogenius/github-actions/.github/workflows/golangci-lint.yml@75995e916be275ed15c2dd4748d664f5e35dfb89 # v1.7.2
    with:
      args: --config=.golangci.yml ./src
