name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs for the same PR / branch (e.g. Renovate force-pushes)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Both jobs are pinned to amd64: the runner label `self-hosted` matches both the
  # amd64 and arm64 ARC sets, and the Go build cache is per-architecture — so a
  # random split across the two halved the cache hit rate and made test and lint
  # compile the same dependency tree twice.
  test:
    uses: mogenius/github-actions/.github/workflows/go-test.yml@c3e043d602a88fea39b680b67480b4a90d8d31d2 # v1.8.0
    with:
      path: src
      runner: arc-runner-set-amd64
  lint:
    uses: mogenius/github-actions/.github/workflows/golangci-lint.yml@c3e043d602a88fea39b680b67480b4a90d8d31d2 # v1.8.0
    with:
      args: --config=.golangci.yml ./src
      runner: arc-runner-set-amd64
