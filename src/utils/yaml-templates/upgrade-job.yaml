apiVersion: batch/v1
kind: Job
metadata:
  name: mo-updater
spec:
  backoffLimit: 4
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  template:
    spec:
      containers:
      # command and args are set by the operator (kubernetes.UpgradeArgs);
      # the image only provides helm
      - image: ghcr.io/mogenius/mogenius-updater:latest
        imagePullPolicy: Always
        name: mo-updater
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: OnFailure
      schedulerName: default-scheduler
      serviceAccount: mogenius-operator-service-account-app
      serviceAccountName: mogenius-operator-service-account-app
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30