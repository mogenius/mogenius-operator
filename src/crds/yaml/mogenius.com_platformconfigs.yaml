---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: platformconfigs.mogenius.com
spec:
  group: mogenius.com
  names:
    kind: PlatformConfig
    listKind: PlatformConfigList
    plural: platformconfigs
    singular: platformconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.platformVersion
      name: Version
      type: string
    - jsonPath: .status.gitOpsStatus.engine
      name: GitOps
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A mogenius `PlatformConfig` defines the configuration for the platform.

          From here on the operatr will derive needed platform components and their configuration.
          For example, a `PlatformConfig` could specifiy your cert-manager configuration,
          which the operator would then apply to the cluster and keep in sync with the `PlatformConfig` resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Specification of platform components and their configuration.

              Every field is optional so that the default PlatformConfig the operator
              creates at startup — an empty spec that only carries the GitOps status —
              passes schema validation.

              Each component field follows the same two-state rule (see reconcileComponent
              and reconcileComponent's "Not declared" check in each platform_*.go file):
              a nil block means "not mentioned" and leaves whatever is installed alone,
              while a present block with Enabled:false actively uninstalls the component.
              This matters because the resource is synced from git with prune enabled, so
              a renamed or broken file path makes the block disappear — and treating that
              as enabled:false would tear down cert-manager, Traefik, Prometheus and Loki
              over a rename.
            properties:
              agentSandboxes:
                description: |-
                  AgentSandboxesConfig installs the mogenius agent-sandbox stack: an isolated
                  namespace where untrusted agent code runs, the mogenius-provided default
                  SandboxTemplate/WarmPool objects, and the network isolation around them.

                  It reuses the existing mogenius-agent-sandbox Helm chart as the install unit;
                  Namespace and NetworkPolicy template into that chart's values (see
                  reconcileAgentSandboxes). Runtime-class / gVisor installation is intentionally
                  not modelled here yet — it is a cluster/node-specific follow-up.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  namespace:
                    description: |-
                      Namespace the sandbox workloads run in. Falls back to the chart default
                      ("agent-sandbox") when empty.
                    type: string
                  networkPolicy:
                    description: NetworkPolicy configures the egress isolation around
                      sandbox pods.
                    properties:
                      additionalBlockedCidrs:
                        description: |-
                          AdditionalBlockedCidrs are extra egress-blocked CIDRs on top of the
                          RFC1918 and link-local defaults — e.g. the kube-apiserver service CIDR,
                          which on some clusters (GKE) sits outside RFC1918 and must be listed
                          explicitly.
                        items:
                          format: cidr
                          type: string
                        type: array
                      managed:
                        description: |-
                          Managed toggles whether the sandbox controller creates a per-sandbox
                          NetworkPolicy. A pointer so leaving it unset keeps the chart default (true).
                          The default rule set already denies RFC1918 and link-local egress — the
                          latter covering the 169.254.169.254 metadata endpoint, the classic
                          SSRF/exfil vector for untrusted agent code.
                        type: boolean
                    type: object
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                type: object
              alloy:
                description: |-
                  AlloyConfig installs Grafana Alloy, the agent that ships logs/metrics to
                  Loki and kube-prometheus-stack.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                type: object
              certManager:
                description: |-
                  CertManagerConfig installs cert-manager and the Issuers/ClusterIssuers it
                  should manage alongside it.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  clusterIssuers:
                    items:
                      description: |-
                        ClusterIssuerConfig declares a cert-manager ClusterIssuer (cluster-scoped,
                        usable by Certificates in any namespace) for cert-manager to create.
                      properties:
                        email:
                          type: string
                        name:
                          type: string
                        server:
                          type: string
                        solvers:
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          type: array
                      required:
                      - email
                      - name
                      type: object
                    type: array
                  enabled:
                    type: boolean
                  issuers:
                    items:
                      description: IssuerConfig declares a cert-manager Issuer (namespace-scoped)
                        for cert-manager to create.
                      properties:
                        email:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        server:
                          type: string
                        solvers:
                          description: |-
                            Solvers are raw cert-manager ACME challenge solver objects (HTTP-01,
                            DNS-01, …), passed through untyped since their shape varies per solver.
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          type: array
                      required:
                      - email
                      - name
                      - namespace
                      type: object
                    type: array
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                type: object
              externalDns:
                description: |-
                  ExternalDNSConfig installs external-dns, which keeps DNS records in sync
                  with Services/Ingresses for the given provider.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  domainFilters:
                    description: DomainFilters restricts external-dns to managing
                      only these domains.
                    items:
                      type: string
                    type: array
                  enabled:
                    type: boolean
                  externalSecret:
                    description: |-
                      ExternalSecret references the provider API credentials. When its Vault
                      is empty, the operator falls back to the first vault declared in
                      spec.externalSecretsOperator.
                    properties:
                      key:
                        type: string
                      path:
                        type: string
                      vault:
                        type: string
                    required:
                    - path
                    type: object
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                  provider:
                    description: |-
                      Provider is the DNS provider name external-dns talks to (e.g. "aws",
                      "cloudflare", "google"). Also used to name the generated provider secret.
                    type: string
                required:
                - externalSecret
                - provider
                type: object
              externalSecretsOperator:
                description: |-
                  ExternalSecretsOperatorConfig installs the External Secrets Operator and
                  declares the vaults other components' ExternalSecret references resolve
                  against.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                  vaults:
                    items:
                      description: |-
                        ExternalSecretVault names a backend (e.g. Vault, AWS Secrets Manager) the
                        External Secrets Operator's SecretStore is created for. Provider holds the
                        backend-specific connection config as raw JSON, since its shape differs
                        per vault type.
                      properties:
                        name:
                          type: string
                        provider:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        type:
                          type: string
                      required:
                      - name
                      - provider
                      - type
                      type: object
                    type: array
                required:
                - vaults
                type: object
              gitOps:
                description: |-
                  GitOpsConfig picks the GitOps engine (ArgoCD xor FluxCD — whichever block
                  is present decides which engine the operator detects/manages) and the
                  repositories that engine syncs from. Each engine block still carries its
                  own Enabled, following the normal component semantics (see
                  PlatformConfigSpec): present-but-disabled uninstalls it.
                properties:
                  argocd:
                    description: ArgoCDInstallConfig installs Argo CD as the GitOps
                      engine.
                    properties:
                      chart:
                        description: |-
                          HelmChartReference overrides where a component's Helm chart is pulled from
                          and what it's installed as. Every field is optional: an absent field falls
                          back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                          in componentSpec), so this only needs to be set to pin a version or point at
                          a mirror.
                        properties:
                          chart:
                            type: string
                          name:
                            description: name of the HelmRelease resource to apply
                            type: string
                          namespace:
                            type: string
                          repository:
                            type: string
                          version:
                            type: string
                        type: object
                      enabled:
                        type: boolean
                      patches:
                        items:
                          description: |-
                            PlatformConfigPatchReference names a PlatformPatch resource (see
                            type_platform_patch.go) applied on top of a component's generated chart
                            values/objects, for overrides this CRD has no dedicated field for.
                          properties:
                            name:
                              description: name of the PlatformPatch resource to apply
                              type: string
                          type: object
                        type: array
                      project:
                        description: |-
                          Project is the Argo CD AppProject name components are deployed into.
                          Falls back to the operator's default project when empty.
                        type: string
                    type: object
                  fluxcd:
                    description: FluxCDInstallConfig installs Flux as the GitOps engine.
                    properties:
                      chart:
                        description: |-
                          HelmChartReference overrides where a component's Helm chart is pulled from
                          and what it's installed as. Every field is optional: an absent field falls
                          back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                          in componentSpec), so this only needs to be set to pin a version or point at
                          a mirror.
                        properties:
                          chart:
                            type: string
                          name:
                            description: name of the HelmRelease resource to apply
                            type: string
                          namespace:
                            type: string
                          repository:
                            type: string
                          version:
                            type: string
                        type: object
                      enabled:
                        type: boolean
                      patches:
                        items:
                          description: |-
                            PlatformConfigPatchReference names a PlatformPatch resource (see
                            type_platform_patch.go) applied on top of a component's generated chart
                            values/objects, for overrides this CRD has no dedicated field for.
                          properties:
                            name:
                              description: name of the PlatformPatch resource to apply
                              type: string
                          type: object
                        type: array
                    type: object
                  repositories:
                    items:
                      properties:
                        externalSecret:
                          description: |-
                            ExternalSecret points at one secret inside a vault declared in
                            spec.externalSecretsOperator.vaults. Vault may be left empty by the caller
                            and defaulted to the first declared vault (see e.g. ExternalDNSConfig).
                          properties:
                            key:
                              type: string
                            path:
                              type: string
                            vault:
                              type: string
                          required:
                          - path
                          type: object
                        githubApp:
                          description: |-
                            GitHubApp authenticates as a GitHub App installation. The engine
                            authenticates with the app directly; the platform commits with
                            short-lived installation tokens the operator mints on request.
                          properties:
                            appId:
                              format: int64
                              minimum: 1
                              type: integer
                            enterpriseBaseUrl:
                              description: |-
                                EnterpriseBaseURL is the REST API root of a GitHub Enterprise Server,
                                e.g. https://github.example.com/api/v3. Empty means github.com.
                              type: string
                            installationId:
                              format: int64
                              minimum: 1
                              type: integer
                            privateKey:
                              description: |-
                                PrivateKey is the app's PEM-encoded private key. secret.key and
                                externalSecret.key default to "privateKey".
                              properties:
                                externalSecret:
                                  description: |-
                                    ExternalSecret points at one secret inside a vault declared in
                                    spec.externalSecretsOperator.vaults. Vault may be left empty by the caller
                                    and defaulted to the first declared vault (see e.g. ExternalDNSConfig).
                                  properties:
                                    key:
                                      type: string
                                    path:
                                      type: string
                                    vault:
                                      type: string
                                  required:
                                  - path
                                  type: object
                                secret:
                                  description: |-
                                    SecretReference points at a Secret already present in the
                                    mogenius-operator's namespace.
                                  properties:
                                    key:
                                      description: Key of the Secret data to reference.
                                      type: string
                                    name:
                                      description: Name of the Secret resource to
                                        reference.
                                      type: string
                                  type: object
                              type: object
                          required:
                          - appId
                          - installationId
                          - privateKey
                          type: object
                        name:
                          type: string
                        path:
                          type: string
                        revision:
                          type: string
                        type:
                          description: |-
                            Type says what the repository holds: "platform" (the default when
                            absent — every config written before the field existed means exactly
                            that) or "application".
                          enum:
                          - platform
                          - application
                          type: string
                        url:
                          type: string
                        write:
                          description: |-
                            Write configures how edits made in the platform reach this repository.
                            Read by the mogenius API, not by this operator: declaring it changes
                            nothing in the cluster on its own.
                          properties:
                            enabled:
                              description: |-
                                Enabled is false to refuse edits for this repository even when a
                                credential exists. Absent means enabled.
                              type: boolean
                            mode:
                              description: Mode is "DIRECT_COMMIT" or "PULL_REQUEST".
                                Defaults to PULL_REQUEST.
                              enum:
                              - DIRECT_COMMIT
                              - PULL_REQUEST
                              type: string
                            provider:
                              description: Provider is "GIT_HUB", "GIT_LAB" or "GITEA".
                                Derived from url when empty.
                              type: string
                            secretRef:
                              description: |-
                                SecretRef names the Secret in the mogenius-operator`s namespace holding the write credentials.
                                secretRef.secret - reference a secret in the mogenius-operator`s namespace
                                secretRef.externalSecret - reference a secret in an external vault,
                                the operator will automatically create the externalsecret for you in the mogenius-operator`s namespace.
                              properties:
                                externalSecret:
                                  description: |-
                                    ExternalSecret points at one secret inside a vault declared in
                                    spec.externalSecretsOperator.vaults. Vault may be left empty by the caller
                                    and defaulted to the first declared vault (see e.g. ExternalDNSConfig).
                                  properties:
                                    key:
                                      type: string
                                    path:
                                      type: string
                                    vault:
                                      type: string
                                  required:
                                  - path
                                  type: object
                                secret:
                                  description: |-
                                    SecretReference points at a Secret already present in the
                                    mogenius-operator's namespace.
                                  properties:
                                    key:
                                      description: Key of the Secret data to reference.
                                      type: string
                                    name:
                                      description: Name of the Secret resource to
                                        reference.
                                      type: string
                                  type: object
                              type: object
                          type: object
                      required:
                      - name
                      - url
                      type: object
                      x-kubernetes-validations:
                      - message: externalSecret and githubApp are mutually exclusive
                        rule: '!(has(self.externalSecret) && has(self.githubApp))'
                      - message: write.secretRef cannot be combined with githubApp,
                          the write token is minted from the app
                        rule: '!(has(self.githubApp) && has(self.write) && has(self.write.secretRef))'
                    type: array
                type: object
              kubePrometheusStack:
                description: |-
                  KubePrometheusStackConfig installs the kube-prometheus-stack chart
                  (Prometheus, Alertmanager and Grafana).
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                type: object
              loki:
                description: LokiConfig installs Loki for log aggregation.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                type: object
              platformSource:
                description: PlatformSource records where this spec came from
                type: string
              platformVersion:
                description: PlatformVersion is the version of the base platform config
                  that this is derived from
                type: string
              renovateOperator:
                description: |-
                  RenovateOperatorConfig installs renovate-operator, which runs a RenovateJob
                  per declared repository to keep dependency manifests up to date.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  maxParallelJobs:
                    description: MaxParallelJobs caps how many RenovateJobs run concurrently.
                    type: integer
                  patches:
                    items:
                      description: |-
                        PlatformConfigPatchReference names a PlatformPatch resource (see
                        type_platform_patch.go) applied on top of a component's generated chart
                        values/objects, for overrides this CRD has no dedicated field for.
                      properties:
                        name:
                          description: name of the PlatformPatch resource to apply
                          type: string
                      type: object
                    type: array
                  repositories:
                    items:
                      properties:
                        externalSecret:
                          description: |-
                            ExternalSecret points at one secret inside a vault declared in
                            spec.externalSecretsOperator.vaults. Vault may be left empty by the caller
                            and defaulted to the first declared vault (see e.g. ExternalDNSConfig).
                          properties:
                            key:
                              type: string
                            path:
                              type: string
                            vault:
                              type: string
                          required:
                          - path
                          type: object
                        filter:
                          description: Filter is a discovery topic used when not referencing
                            a gitops repository.
                          type: string
                        gitOpsRepository:
                          description: |-
                            GitOpsRepository references a repository from spec.gitOps.repositories by name.
                            Its name is used as the discoverTopics filter.
                          type: string
                        name:
                          description: Name of the RenovateJob resource. Defaults
                            to the gitOpsRepository name when set.
                          type: string
                        provider:
                          description: |-
                            RenovateProvider names the SCM provider a RenovateJob discovers repositories
                            on (e.g. "github", "gitlab", "gitea") and, for self-hosted instances, the
                            API endpoint to use instead of the provider's public default.
                          properties:
                            endpoint:
                              type: string
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        schedule:
                          type: string
                      required:
                      - provider
                      type: object
                    type: array
                type: object
              traefik:
                description: TraefikConfig installs Traefik as the cluster's ingress
                  controller.
                properties:
                  chart:
                    description: |-
                      HelmChartReference overrides where a component's Helm chart is pulled from
                      and what it's installed as. Every field is optional: an absent field falls
                      back to the component's hardcoded default (see e.g. defaultChart/defaultRepo
                      in componentSpec), so this only needs to be set to pin a version or point at
                      a mirror.
                    properties:
                      chart:
                        type: string
                      name:
                        description: name of the HelmRelease resource to apply
                        type: string
                      namespace:
                        type: string
                      repository:
                        type: string
                      version:
                        type: string
                    type: object
                  enabled:
                    type: boolean
                  patches:
                    items:
