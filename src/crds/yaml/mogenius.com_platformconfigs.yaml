                      and owned by mogenius.
                    type: boolean
                  namespace:
                    type: string
                  releaseName:
                    type: string
                  source:
                    description: |-
                      Source is "spec" when the information comes from spec.gitOps and
                      "detected" when it comes from probing the cluster.
                    type: string
                  version:
                    description: Version of the engine, e.g. "v2.7.5".
                    type: string
                type: object
