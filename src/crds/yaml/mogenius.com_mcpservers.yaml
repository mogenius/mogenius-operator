---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mcpservers.mogenius.com
spec:
  group: mogenius.com
  names:
    categories:
    - mogenius
    kind: McpServer
    listKind: McpServerList
    plural: mcpservers
    shortNames:
    - mcpserver
    singular: mcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.transport
      name: Transport
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.toolCount
      name: Tools
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A mogenius McpServer resource declares an external MCP server that AI agents
          can use as a source of additional tools. Agents reference one or more McpServer
          CRs via spec.mcpServerRefs; the operator connects to the server, discovers its
          tools, and makes them available to the agent for every run.
          McpServers are only processed in the operator's own namespace (MO_OWN_NAMESPACE).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allowedTools:
                description: |-
                  AllowedTools is an optional allowlist of tool names exposed to agents.
                  An empty list means all tools discovered from the server are available.
                items:
                  type: string
                type: array
              auth:
                description: |-
                  Authentication for the MCP server. Omit or set type to "none" for
                  unauthenticated servers.
                properties:
                  header:
                    description: |-
                      Header name for apiKey auth (e.g. "X-Api-Key"). Ignored for bearer (which
                      always uses the Authorization header) and none.
                    type: string
                  secretRef:
                    description: |-
                      Secret in the same namespace whose value is used as the credential token.
                      Required for bearer and apiKey auth types; ignored for none.
                    properties:
                      key:
                        description: Key within the Secret's data; defaults to "API_KEY"
                          when empty.
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  type:
                    description: |-
                      Authentication scheme.
                      "bearer" adds an Authorization: Bearer <token> header.
                      "apiKey" adds a custom header named by the Header field.
                      "none" sends no credential.
                    enum:
                    - none
                    - bearer
                    - apiKey
                    type: string
                required:
                - type
                type: object
              description:
                description: Optional description of this MCP server's purpose.
                type: string
              displayName:
                description: Human-readable name shown in the UI.
                type: string
              headers:
                description: |-
                  Additional HTTP headers sent with every request to the MCP server.
                  Use valueFrom to reference header values stored in a Secret.
                items:
                  description: |-
                    McpServerHeader is a single HTTP header added to every MCP server request.
                    Exactly one of Value or ValueFrom should be set.
                  properties:
                    name:
                      description: HTTP header name.
                      minLength: 1
                      type: string
                    value:
                      description: Literal header value. Use ValueFrom to pull from
                        a Secret instead.
                      type: string
                    valueFrom:
                      description: |-
                        Secret whose data key provides the header value. Takes precedence over
                        Value when both are set.
                      properties:
                        key:
                          description: Key within the Secret's data; defaults to "API_KEY"
                            when empty.
                          type: string
                        name:
                          description: Name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - name
                  type: object
                type: array
              transport:
                description: Transport protocol used to communicate with the MCP server.
                enum:
                - streamableHttp
                - sse
                type: string
              url:
                description: Base URL of the MCP server endpoint.
                minLength: 1
                type: string
            required:
            - transport
            - url
            type: object
          status:
            properties:
              availableTools:
                description: |-
                  AvailableTools lists the tool names discovered from the MCP server at the
                  last successful connection; empty when the server has not yet been reached
                  or returned no tools. When AllowedTools is set, only allowed tools appear.
                items:
                  type: string
                type: array
              conditions:
                description: |-
                  Conditions report the state of the McpServer; "Ready" indicates that the
                  spec is valid and the server was last successfully reached.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastConnectedAt:
                description: |-
                  LastConnectedAt records when the server was last probed successfully
                  (RFC3339 timestamp).
                type: string
              observedGeneration:
                description: Generation of the spec the conditions were last evaluated
                  against.
                format: int64
                type: integer
              toolCount:
                description: ToolCount is the number of currently available tools.
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
