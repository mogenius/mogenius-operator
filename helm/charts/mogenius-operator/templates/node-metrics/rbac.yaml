{{- if .Values.nodeMetrics.enabled }}
# Dedicated, least-privilege identity for the node-metrics DaemonSet.
# It runs on every node with hostNetwork + host /proc,/sys mounts and (with
# traffic collection) NET_ADMIN/SYS_ADMIN/BPF/SYS_PTRACE — a large attack
# surface. It must NOT carry the cluster-admin token of the main operator.
#
# The mogenius-nodemetrics binary touches the Kubernetes API only to read the
# valkey secret in the operator's own namespace, and only when
# MO_VALKEY_PASSWORD is not set. It neither lists nodes (cloud-provider
# detection is not linked into it) nor creates or updates the cluster secret
# (the operator does). Everything else (pod inventory, cpu/ram/network stats)
# comes from Valkey and the host /proc filesystem, so no pod/watch/lease
# permissions are needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fullnameOverride }}-node-metrics
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.fullnameOverride }}-node-metrics
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["mogenius-operator-valkey"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.fullnameOverride }}-node-metrics
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.fullnameOverride }}-node-metrics
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Values.fullnameOverride }}-node-metrics
  apiGroup: rbac.authorization.k8s.io
{{- end }}
