suite: rbac and service account
templates:
  - serviceaccount.yaml
  - rbac.yaml
tests:
  - it: creates the operator ServiceAccount
    template: serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: mogenius-operator-service-account-app

  - it: binds the operator ServiceAccount
    template: rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: subjects[0].name
          value: mogenius-operator-service-account-app
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: honors a custom serviceAccount.name on the ServiceAccount object
    template: serviceaccount.yaml
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: honors a custom serviceAccount.name in the cluster role binding
    template: rbac.yaml
    set:
      serviceAccount.name: custom-sa
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-sa
